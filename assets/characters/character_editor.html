<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Editor</title>
<style>
  :root { --bg: #f6f2ee; --panel: #ffffff; --line: #e4dcd4; --text: #29232a; --muted: #7b6f6a; --brand: #bc0000; --lime: #a8ce20; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stage { aspect-ratio: 1; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  label.f { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  input[type=color] { width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 1px; background: none; }
  input[type=range] { width: 100%; accent-color: var(--brand); }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 12px; cursor: pointer; color: var(--text); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button[aria-pressed=true] { background: var(--text); color: #fff; }
  textarea { width: 100%; min-height: 360px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fffdfb; color: var(--text); resize: vertical; tab-size: 2; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: #b3261e; font-size: 13px; min-height: 18px; }
  .bgsw button { padding: 4px 10px; }
</style>
</head>
<body>
<header>
  <h1>Animated Character — แก้ไขตัวละคร SVG</h1>
  <div class="row">
    <label class="btn">เปิดไฟล์ SVG<input type="file" id="open" accept=".svg,image/svg+xml" hidden></label>
    <button id="copy">คัดลอกโค้ด</button>
    <button id="reset">กลับเป็นต้นฉบับ</button>
    <button class="primary" id="download">ดาวน์โหลด SVG</button>
  </div>
</header>

<div class="wrap">
  <section class="card">
    <div class="stage" id="stage"><iframe id="view" title="ตัวอย่างตัวละคร"></iframe></div>
    <div class="row" style="margin-top:10px; justify-content:space-between">
      <div class="row">
        <button id="play" aria-pressed="false">⏸ หยุด</button>
        <span class="muted">ความเร็ว <b id="speedOut">1.0×</b></span>
      </div>
      <div class="row bgsw" id="bgsw">
        <span class="muted">พื้นหลัง</span>
        <button data-bg="#ffffff">ขาว</button><button data-bg="#fff6ee">ครีม</button>
        <button data-bg="#141313">ดำ</button><button data-bg="checker">โปร่งใส</button>
      </div>
    </div>
    <input type="range" id="speed" min="0.25" max="3" step="0.05" value="1" aria-label="ความเร็วอนิเมชัน">
    <p class="muted">ความเร็วจะถูกบันทึกลงในโค้ด (ค่า animation-duration) เมื่อดาวน์โหลด ส่วนปุ่มหยุดใช้เฉพาะตอนดูตัวอย่าง</p>
  </section>

  <section class="card">
    <h2>สีของตัวละคร</h2>
    <div class="grid" id="colors"></div>
    <h2 style="margin-top:16px">โค้ด SVG <span class="muted">(แก้แล้วตัวอย่างอัปเดตทันที)</span></h2>
    <textarea id="code" spellcheck="false" aria-label="โค้ด SVG"></textarea>
    <div class="err" id="err"></div>
  </section>
</div>

<script type="image/svg+xml" id="original">
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Animated human character</title>
<desc id="desc">A friendly cartoon young person in a red jacket, with subtle body movement, blinking eyes, and waving hand.</desc>
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffd9bd"/><stop offset="1" stop-color="#eeb18e"/>
  </linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff555b"/><stop offset="1" stop-color="#bd142b"/>
  </linearGradient>
  <style>
    .person { transform-origin: 400px 690px; animation: float 3s ease-in-out infinite; }
    .wave { transform-origin: 550px 455px; animation: wave 1.2s ease-in-out infinite; }
    .eyes { transform-origin: 400px 330px; animation: blink 4s infinite; }
    .hair { transform-origin: 400px 250px; animation: hairMove 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes wave { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-15deg)} 55%{transform:rotate(12deg)} 80%{transform:rotate(-8deg)} }
    @keyframes blink { 0%,44%,48%,100%{transform:scaleY(1)} 46%{transform:scaleY(.08)} }
    @keyframes hairMove { 0%,100%{transform:rotate(0)} 50%{transform:rotate(2deg)} }
    @media (prefers-reduced-motion: reduce) { .person,.wave,.eyes,.hair{animation:none} }
  </style>
</defs>

<ellipse cx="400" cy="710" rx="155" ry="22" fill="#4c2025" opacity=".12"/>
<g class="person">
  <!-- legs -->
  <path d="M337 580 L328 680 Q327 703 350 704 L376 704 Q390 701 385 683 L395 590Z" fill="#293449" stroke="#29232a" stroke-width="9" stroke-linejoin="round"/>
  <path d="M412 590 L422 682 Q421 703 444 704 L470 704 Q490 700 480 680 L474 578Z" fill="#293449" stroke="#29232a" stroke-width="9" stroke-linejoin="round"/>
  <path d="M326 690 Q350 679 383 692 L389 713 L315 713 Q308 702 326 690Z" fill="#f5f3ef" stroke="#29232a" stroke-width="8"/>
  <path d="M425 691 Q454 679 481 690 L497 712 L420 712 Q414 700 425 691Z" fill="#f5f3ef" stroke="#29232a" stroke-width="8"/>

  <!-- torso -->
  <path d="M315 410 Q400 376 485 410 L510 594 Q403 628 290 594Z" fill="url(#shirt)" stroke="#29232a" stroke-width="10" stroke-linejoin="round"/>
  <path d="M372 400 L400 450 L429 400" fill="#fff0e8" stroke="#29232a" stroke-width="7" stroke-linejoin="round"/>
  <path d="M399 450 L399 596" stroke="#9d1728" stroke-width="5" opacity=".7"/>
  <circle cx="400" cy="495" r="5" fill="#ffe1d3"/><circle cx="400" cy="535" r="5" fill="#ffe1d3"/>

  <!-- left arm -->
  <path d="M317 429 Q284 438 271 478 L244 548 Q235 568 252 578 Q270 587 281 566 L328 488Z" fill="url(#shirt)" stroke="#29232a" stroke-width="9" stroke-linejoin="round"/>
  <path d="M251 562 Q238 579 250 593 Q262 607 278 591 L286 570Z" fill="url(#skin)" stroke="#29232a" stroke-width="8"/>

  <!-- raised waving arm -->
  <g class="wave">
    <path d="M480 427 Q520 425 537 459 L566 507 Q576 526 559 539 Q542 550 529 531 L489 482Z" fill="url(#shirt)" stroke="#29232a" stroke-width="9" stroke-linejoin="round"/>
    <path d="M554 517 Q566 500 582 510 Q595 518 590 536 L582 559 Q578 573 564 572 Q548 571 549 555Z" fill="url(#skin)" stroke="#29232a" stroke-width="8"/>
    <path d="M565 514 Q553 492 562 479 Q570 469 578 481 L583 503 Q594 482 603 491 Q612 501 597 520 L583 536Z" fill="url(#skin)" stroke="#29232a" stroke-width="8" stroke-linejoin="round"/>
    <path d="M579 515 Q589 494 602 502" fill="none" stroke="#d99576" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- neck -->
  <path d="M369 369 L369 416 Q400 445 431 416 L431 367Z" fill="url(#skin)" stroke="#29232a" stroke-width="8"/>

  <!-- ears and face -->
  <ellipse cx="303" cy="321" rx="21" ry="34" fill="url(#skin)" stroke="#29232a" stroke-width="8"/>
  <ellipse cx="497" cy="321" rx="21" ry="34" fill="url(#skin)" stroke="#29232a" stroke-width="8"/>
  <path d="M306 307 Q305 225 400 211 Q495 225 494 307 L481 359 Q467 416 400 421 Q333 416 319 359Z" fill="url(#skin)" stroke="#29232a" stroke-width="9"/>

  <!-- hair -->
  <g class="hair">
    <path d="M307 309 Q286 236 338 197 Q377 165 430 184 Q494 191 501 260 Q503 286 490 315 Q470 280 448 263 Q416 284 372 270 Q343 267 321 298 L317 325Z" fill="#30252a" stroke="#29232a" stroke-width="9" stroke-linejoin="round"/>
    <path d="M333 228 Q370 188 414 202 Q385 205 372 239 Q355 250 333 228Z" fill="#594047" opacity=".8"/>
  </g>

  <!-- face -->
  <g class="eyes">
    <ellipse cx="363" cy="326" rx="8" ry="13" fill="#30252a"/>
    <ellipse cx="438" cy="326" rx="8" ry="13" fill="#30252a"/>
    <circle cx="365" cy="322" r="3" fill="#fff"/>
    <circle cx="440" cy="322" r="3" fill="#fff"/>
  </g>
  <path d="M342 302 Q362 291 379 301 M422 301 Q440 291 458 302" fill="none" stroke="#30252a" stroke-width="6" stroke-linecap="round"/>
  <path d="M399 334 Q391 355 402 359" fill="none" stroke="#d18f72" stroke-width="4" stroke-linecap="round"/>
  <path d="M377 378 Q400 399 425 378" fill="none" stroke="#8e3941" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="340" cy="365" rx="17" ry="9" fill="#f28f8d" opacity=".45"/>
  <ellipse cx="460" cy="365" rx="17" ry="9" fill="#f28f8d" opacity=".45"/>
</g>

<!-- little motion accents -->
<path d="M606 360 L619 340 M623 374 L644 367 M589 340 L590 319" stroke="#ed3549" stroke-width="7" stroke-linecap="round"/>
<path d="M190 385 L200 365 M210 397 L230 392" stroke="#ed3549" stroke-width="6" stroke-linecap="round" opacity=".7"/>
</svg>
</script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const ORIGINAL = $("#original").textContent.trim();
const KEY = "character-editor.draft";
const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } }, set(v) { try { localStorage.setItem(KEY, v); } catch {} } };

// Editable colours: where each one lives in the SVG (same structure as the original file).
const COLORS = [
  { label: "เสื้อ (สว่าง)", sel: "#shirt stop:nth-of-type(1)", attr: "stop-color" },
  { label: "เสื้อ (เงา)", sel: "#shirt stop:nth-of-type(2)", attr: "stop-color" },
  { label: "ผิว (สว่าง)", sel: "#skin stop:nth-of-type(1)", attr: "stop-color" },
  { label: "ผิว (เงา)", sel: "#skin stop:nth-of-type(2)", attr: "stop-color" },
  { label: "ผม", sel: ".hair path:nth-of-type(1)", attr: "fill" },
  { label: "กางเกง", match: { attr: "fill", value: "#293449" } },
  { label: "รองเท้า", match: { attr: "fill", value: "#f5f3ef" } },
  { label: "เส้นขยับ", match: { attr: "stroke", value: "#ed3549" } },
];

let doc = null;            // parsed SVG document (source of truth)
let baseDur = null;        // animation durations as loaded, so the speed slider never compounds
let lastGood = ORIGINAL;

function parse(text) {
  const d = new DOMParser().parseFromString(text, "image/svg+xml");
  const pe = d.querySelector("parsererror");
  if (pe || d.documentElement.nodeName !== "svg") throw new Error(pe ? pe.textContent.split("\n")[0] : "ไม่ใช่ไฟล์ SVG");
  return d;
}
const serialize = () => new XMLSerializer().serializeToString(doc.documentElement);
function styleEl() { return doc.querySelector("style"); }
function readDurations() {
  const st = styleEl(); if (!st) return [];
  return [...st.textContent.matchAll(/animation:\s*([\w-]+)\s+([\d.]+)s/g)].map((m) => ({ name: m[1], s: parseFloat(m[2]) }));
}
function applySpeed(speed) {
  const st = styleEl(); if (!st || !baseDur) return;
  let i = 0;
  st.textContent = st.textContent.replace(/(animation:\s*[\w-]+\s+)([\d.]+)s/g, (all, head) => {
    const b = baseDur[i++]; return b ? `${head}${+(b.s / speed).toFixed(3)}s` : all;
  });
}
// nodes for a colour control
function nodesFor(c) {
  if (c.sel) return [...doc.querySelectorAll(c.sel)].map((n) => [n, c.attr]);
  return [...doc.querySelectorAll(`[${c.match.attr}]`)].filter((n) => (n.getAttribute(c.match.attr) || "").toLowerCase() === c.match.value).map((n) => [n, c.match.attr]);
}

function render(text) {
  const bg = $("#stage").dataset.bg || "#ffffff";
  const back = bg === "checker"
    ? "background: repeating-conic-gradient(#e9e4df 0 25%, #fff 0 50%) 0 0/24px 24px;" : `background:${bg};`;
  $("#view").srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;${back}}
    svg{width:100%;height:100%;display:block}</style></head><body>${text}</body></html>`;
  $("#view").onload = () => setPaused($("#play").getAttribute("aria-pressed") === "true");
}
function setPaused(p) {
  const w = $("#view").contentWindow; if (!w || !w.document.getAnimations) return;
  w.document.getAnimations().forEach((a) => (p ? a.pause() : a.play()));
}

function load(text, remember = true) {
  doc = parse(text);
  baseDur = readDurations();
  $("#speed").value = 1; $("#speedOut").textContent = "1.0×";
  syncControls(); commit(remember);
}
function commit(remember = true) {
  const text = serialize();
  lastGood = text;
  $("#code").value = text;
  $("#err").textContent = "";
  render(text);
  if (remember) store.set(text);
}
function syncControls() {
  const box = $("#colors"); box.innerHTML = "";
  COLORS.forEach((c, i) => {
    const ns = nodesFor(c);
    if (!ns.length) return;
    const cur = ns[0][0].getAttribute(ns[0][1]) || "#000000";
    const lab = document.createElement("label"); lab.className = "f";
    lab.innerHTML = `<span>${c.label}</span><input type="color" value="${/^#[0-9a-f]{6}$/i.test(cur) ? cur : "#000000"}" data-i="${i}">`;
    box.appendChild(lab);
  });
  box.querySelectorAll("input").forEach((inp) => inp.addEventListener("input", () => {
    const c = COLORS[+inp.dataset.i];
    // update every node of this group, then re-find by the new value next time
    nodesFor(c).forEach(([n, a]) => n.setAttribute(a, inp.value));
    if (c.match) c.match.value = inp.value.toLowerCase();
    commit();
  }));
}

let t = null;
$("#code").addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(() => {
    try { doc = parse($("#code").value); baseDur = readDurations(); $("#speed").value = 1; $("#speedOut").textContent = "1.0×";
          lastGood = $("#code").value; $("#err").textContent = ""; render(lastGood); store.set(lastGood); syncControls(); }
    catch (e) { $("#err").textContent = "โค้ดยังไม่สมบูรณ์ (ตัวอย่างแสดงเวอร์ชันล่าสุดที่ถูกต้อง): " + e.message; }
  }, 350);
});
$("#speed").addEventListener("input", () => {
  const s = +$("#speed").value; $("#speedOut").textContent = s.toFixed(2).replace(/0$/, "") + "×";
  applySpeed(s); commit();
});
$("#play").addEventListener("click", () => {
  const p = $("#play").getAttribute("aria-pressed") !== "true";
  $("#play").setAttribute("aria-pressed", p); $("#play").textContent = p ? "▶ เล่น" : "⏸ หยุด"; setPaused(p);
});
document.querySelectorAll("#bgsw button").forEach((b) => b.addEventListener("click", () => { $("#stage").dataset.bg = b.dataset.bg; render(lastGood); }));
$("#reset").addEventListener("click", () => { if (confirm("กลับเป็นโค้ดต้นฉบับ? การแก้ไขที่ยังไม่ได้ดาวน์โหลดจะหายไป")) { COLORS.forEach((c, i) => { if (c.match) c.match.value = INITIAL_MATCH[i]; }); load(ORIGINAL); } });
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(lastGood); $("#copy").textContent = "คัดลอกแล้ว ✓"; }
  catch { $("#code").select(); document.execCommand("copy"); $("#copy").textContent = "คัดลอกแล้ว ✓"; }
  setTimeout(() => ($("#copy").textContent = "คัดลอกโค้ด"), 1500);
});
$("#download").addEventListener("click", () => {
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + lastGood + "\n"], { type: "image/svg+xml" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "animated_character.svg"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("#open").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { load(await f.text()); } catch (err) { $("#err").textContent = "เปิดไฟล์ไม่ได้: " + err.message; }
  e.target.value = "";
});
const INITIAL_MATCH = COLORS.map((c) => c.match && c.match.value);

// start from the saved draft if there is one, else the original
try { const d = store.get(); load(d || ORIGINAL, false); if (d) syncMatchValues(); }
catch { load(ORIGINAL, false); }
function syncMatchValues() {
  // a saved draft may have recoloured the "match" groups; pick up their current colours from the draft
  COLORS.forEach((c, i) => {
    if (!c.match) return;
    const orig = parse(ORIGINAL);
    const o = [...orig.querySelectorAll(`[${c.match.attr}]`)].find((n) => n.getAttribute(c.match.attr).toLowerCase() === INITIAL_MATCH[i]);
    if (!o) return;
    const path = [];  // same position in the draft
    let n = o; while (n && n.parentNode && n.parentNode.nodeType === 1) { path.unshift([...n.parentNode.children].indexOf(n)); n = n.parentNode; }
    let d = doc.documentElement; for (const k of path) d = d && d.children[k];
    if (d && d.getAttribute(c.match.attr)) c.match.value = d.getAttribute(c.match.attr).toLowerCase();
  });
  syncControls();
}
</script>
</body>
</html>
